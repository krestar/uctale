<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>UCTale</title>
    <script>
        (() => {
            const storageKey = 'uctale.theme-mode'
            const supportedModes = new Set(['system', 'light', 'dark'])
            let mode = 'system'

            try {
                const storedMode = localStorage.getItem(storageKey)
                if (supportedModes.has(storedMode)) mode = storedMode
            } catch {
                // Storage can be blocked. System preference remains a safe default.
            }

            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
            const theme = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode

            document.documentElement.dataset.theme = theme
            document.documentElement.style.colorScheme = theme
            window.__UCTALE_INITIAL_THEME_MODE__ = mode
        })()
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
