spring.application.name=uctale

google.ai.api-key=${GOOGLE_AI_API_KEY}
pollinations.token=${POLLINATIONS_TOKEN}
game.access.password=${GAME_ACCESS_PASSWORD}
game.access.session-secret=${GAME_ACCESS_SESSION_SECRET}
game.access.session-ttl-seconds=${GAME_ACCESS_SESSION_TTL_SECONDS:3600}
game.owner.cookie-ttl-seconds=${GAME_OWNER_COOKIE_TTL_SECONDS:15552000}
game.access.cookie-secure=${GAME_ACCESS_COOKIE_SECURE:true}
game.access.rate-limit.failure-limit=${GAME_ACCESS_RATE_LIMIT_FAILURE_LIMIT:5}
game.access.rate-limit.window-seconds=${GAME_ACCESS_RATE_LIMIT_WINDOW_SECONDS:300}
game.cors.allowed-origins=${GAME_CORS_ALLOWED_ORIGINS:https://uctale.vercel.app}
game.cost.rate-limit.window-seconds=${GAME_COST_RATE_LIMIT_WINDOW_SECONDS:60}
game.cost.rate-limit.narrative-limit=${GAME_COST_NARRATIVE_LIMIT:12}
game.cost.rate-limit.image-limit=${GAME_COST_IMAGE_LIMIT:8}
game.cost.budget.daily-warning-units=${GAME_COST_BUDGET_DAILY_WARNING_UNITS:500}
game.cost.budget.daily-critical-units=${GAME_COST_BUDGET_DAILY_CRITICAL_UNITS:750}
game.cost.budget.monthly-warning-units=${GAME_COST_BUDGET_MONTHLY_WARNING_UNITS:10000}
game.cost.budget.monthly-critical-units=${GAME_COST_BUDGET_MONTHLY_CRITICAL_UNITS:15000}
game.cost.budget.narrative-attempt-units=${GAME_COST_BUDGET_NARRATIVE_ATTEMPT_UNITS:1}
game.cost.budget.image-attempt-units=${GAME_COST_BUDGET_IMAGE_ATTEMPT_UNITS:1}
game.cost.budget.critical-mode=${GAME_COST_BUDGET_CRITICAL_MODE:ALERT_ONLY}

game.image.model=${GAME_IMAGE_MODEL:flux}
game.image.width=${GAME_IMAGE_WIDTH:768}
game.image.height=${GAME_IMAGE_HEIGHT:432}
game.image.square-size=${GAME_IMAGE_SQUARE_SIZE:512}
game.image.safe=${GAME_IMAGE_SAFE:true}
game.image.style-version=${GAME_IMAGE_STYLE_VERSION:uctale-charcoal-v2}
game.image.connect-timeout-ms=${GAME_IMAGE_CONNECT_TIMEOUT_MS:10000}
game.image.read-timeout-ms=${GAME_IMAGE_READ_TIMEOUT_MS:120000}
game.image.max-retries=${GAME_IMAGE_MAX_RETRIES:2}
game.image.retry-base-delay-ms=${GAME_IMAGE_RETRY_BASE_DELAY_MS:250}
game.image.max-response-bytes=${GAME_IMAGE_MAX_RESPONSE_BYTES:8388608}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.keepalive-time=${DATABASE_POOL_KEEPALIVE_TIME_MS:0}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MINIMUM_IDLE:0}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAXIMUM_SIZE:3}
spring.datasource.hikari.idle-timeout=${DATABASE_POOL_IDLE_TIMEOUT_MS:60000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

server.port=${PORT:8080}
