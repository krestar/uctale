name: Issue 61 final visual evidence

on:
  push:
    branches: [refactor/issue-61-charcoal-folio-ui]

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[issue-61-final-evidence]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-61-charcoal-folio-ui
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser runner
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start frontend
        run: |
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 4173 > /tmp/uctale-after.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173 > /dev/null
      - name: Capture settled light and dark screens
        working-directory: frontend
        run: |
          mkdir -p final-evidence
          cat > final-evidence/capture.mjs <<'NODE'
          import { chromium } from 'playwright'

          const fixture = {
            sessionId: 'visual-evidence-session',
            turnNumber: 1,
            title: '비가 그친 뒤의 서울역',
            storyText: '비가 그친 플랫폼에는 젖은 철 냄새가 남아 있었다.\n\n멀리서 전광판이 한 번 깜빡이고, 텅 빈 선로 너머에서 누군가 당신의 이름을 불렀다.',
            mainImageUrl: '/api/game/assets/visual-evidence',
            choices: [
              { id: 'approach', text: '목소리가 들린 승강장 끝으로 천천히 다가간다.' },
              { id: 'wait', text: '기둥 뒤에 몸을 숨기고 주변의 움직임을 먼저 살핀다.' },
              { id: 'leave', text: '출구 표지판을 따라 역사 밖으로 빠져나간다.' },
            ],
          }
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="768" height="432" viewBox="0 0 768 432"><rect width="768" height="432" fill="#d8d4cc"/><path d="M0 330 L180 250 L330 300 L510 180 L768 260 V432 H0 Z" fill="#66645f"/><path d="M0 360 L200 290 L400 340 L610 250 L768 300" fill="none" stroke="#2f302d" stroke-width="10"/><circle cx="575" cy="120" r="48" fill="#f3f0e8" stroke="#4b4b47" stroke-width="7"/><text x="42" y="70" font-family="sans-serif" font-size="27" fill="#383936">UCTALE · CHARCOAL SCENE FIXTURE</text></svg>`

          async function mockApi(page) {
            await page.route('http://localhost:8080/api/game/**', async route => {
              const url = route.request().url()
              if (url.endsWith('/access-session')) return route.fulfill({ status: 200, contentType: 'application/json', body: '{}' })
              if (url.endsWith('/init')) return route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(fixture) })
              if (url.includes('/assets/')) return route.fulfill({ status: 200, contentType: 'image/svg+xml', body: svg })
              return route.fulfill({ status: 200, contentType: 'application/json', body: '{}' })
            })
          }

          async function choose(page, label) {
            const radio = page.getByLabel(label)
            await radio.focus()
            await page.keyboard.press('Space')
            await page.waitForTimeout(220)
            if (!(await radio.isChecked())) throw new Error(`theme not selected: ${label}`)
          }

          async function setupGame(page) {
            const textareas = page.locator('textarea')
            await textareas.nth(0).fill('현대 서울, 폭우 직후 통신이 끊긴 밤')
            await textareas.nth(1).fill('집으로 돌아가던 평범한 직장인')
            await page.getByRole('button', { name: /모험 시작하기/ }).click()
            await page.getByText(fixture.title, { exact: false }).first().waitFor({ timeout: 10000 })
            await page.locator('img').last().waitFor({ timeout: 10000 })
            await page.waitForTimeout(2500)
          }

          const browser = await chromium.launch()
          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, colorScheme: 'light' })
            await mockApi(page)
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' })
            await page.waitForSelector('textarea')

            await choose(page, '라이트')
            await page.screenshot({ path: 'final-evidence/mobile-setup-light.png', fullPage: true })
            await choose(page, '다크')
            await page.screenshot({ path: 'final-evidence/mobile-setup-dark.png', fullPage: true })

            await choose(page, '라이트')
            await setupGame(page)
            await page.screenshot({ path: 'final-evidence/mobile-gameplay-light.png', fullPage: true })
            await choose(page, '다크')
            await page.screenshot({ path: 'final-evidence/mobile-gameplay-dark.png', fullPage: true })

            await page.setViewportSize({ width: 1280, height: 900 })
            await choose(page, '라이트')
            await page.screenshot({ path: 'final-evidence/desktop-gameplay-light.png', fullPage: true })
            await choose(page, '다크')
            await page.screenshot({ path: 'final-evidence/desktop-gameplay-dark.png', fullPage: true })
          } finally {
            await browser.close()
          }
          NODE
          node final-evidence/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: issue-61-final-visual-evidence
          path: frontend/final-evidence/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup temporary workflow
        run: |
          rm .github/workflows/issue-61-final-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/issue-61-final-evidence.yml
          git commit -m "test(frontend): 최종 visual evidence 생성 [issue-61-final-evidence]"
          git push origin HEAD:refactor/issue-61-charcoal-folio-ui
