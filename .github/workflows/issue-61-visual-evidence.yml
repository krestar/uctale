name: Issue 61 visual evidence

on:
  push:
    branches: [refactor/issue-61-charcoal-folio-ui]

permissions:
  contents: write

jobs:
  visual-evidence:
    if: ${{ !contains(github.event.head_commit.message, '[issue-61-visual]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-61-charcoal-folio-ui
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare main baseline
        run: |
          git worktree add --detach /tmp/uctale-before origin/main
          npm --prefix /tmp/uctale-before/frontend ci
      - name: Start frontends
        run: |
          npm --prefix /tmp/uctale-before/frontend run dev -- --host 127.0.0.1 --port 4174 > /tmp/uctale-before.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 4173 > /tmp/uctale-after.log 2>&1 &
          for port in 4173 4174; do
            for attempt in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:${port}" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:${port}" > /dev/null
          done
      - name: Capture and verify
        working-directory: frontend
        run: |
          mkdir -p visual-evidence
          cat > visual-evidence/capture.mjs <<'NODE'
          import { chromium } from 'playwright'
          import fs from 'node:fs/promises'

          const title = '비가 그친 뒤의 서울역'
          const fixture = {
            sessionId: 'visual-evidence-session', turnNumber: 1, title,
            storyText: '비가 그친 플랫폼에는 젖은 철 냄새가 남아 있었다.\n\n멀리서 전광판이 한 번 깜빡이고, 텅 빈 선로 너머에서 누군가 당신의 이름을 불렀다.',
            mainImageUrl: '/api/game/assets/visual-evidence',
            choices: [
              { id: 'approach', text: '목소리가 들린 승강장 끝으로 천천히 다가간다.' },
              { id: 'wait', text: '기둥 뒤에 몸을 숨기고 주변의 움직임을 먼저 살핀다.' },
              { id: 'leave', text: '출구 표지판을 따라 역사 밖으로 빠져나간다.' },
            ],
          }
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="768" height="432" viewBox="0 0 768 432"><rect width="768" height="432" fill="#d8d4cc"/><path d="M0 330 L180 250 L330 300 L510 180 L768 260 V432 H0 Z" fill="#66645f"/><path d="M0 360 L200 290 L400 340 L610 250 L768 300" fill="none" stroke="#2f302d" stroke-width="10"/><circle cx="575" cy="120" r="48" fill="#f3f0e8" stroke="#4b4b47" stroke-width="7"/><text x="42" y="70" font-family="sans-serif" font-size="27" fill="#383936">UCTALE · CHARCOAL SCENE FIXTURE</text></svg>`

          async function mockApi(page) {
            await page.route('http://localhost:8080/api/game/**', async route => {
              const url = route.request().url()
              if (url.endsWith('/access-session')) return route.fulfill({ status: 200, contentType: 'application/json', body: '{}' })
              if (url.endsWith('/init')) return route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(fixture) })
              if (url.includes('/assets/')) return route.fulfill({ status: 200, contentType: 'image/svg+xml', body: svg })
              return route.fulfill({ status: 200, contentType: 'application/json', body: '{}' })
            })
          }

          async function waitSetup(page) {
            await page.waitForSelector('textarea', { timeout: 10000 })
          }

          async function startGame(page) {
            const inputs = page.locator('textarea')
            await inputs.nth(0).fill('현대 서울, 폭우 직후 통신이 끊긴 밤')
            await inputs.nth(1).fill('집으로 돌아가던 평범한 직장인')
            await page.getByRole('button', { name: /모험 시작하기/ }).click()
            await page.getByText(title, { exact: false }).first().waitFor({ timeout: 10000 })
            await page.locator('img').last().waitFor({ timeout: 10000 })
            await page.waitForTimeout(2500)
          }

          async function chooseTheme(page, label) {
            const radio = page.getByLabel(label)
            await radio.focus()
            await page.keyboard.press('Space')
            if (!(await radio.isChecked())) throw new Error(`Theme radio was not keyboard-selectable: ${label}`)
          }

          async function noOverflow(page, width, label, checks) {
            await page.setViewportSize({ width, height: 900 })
            await page.waitForTimeout(80)
            const value = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, clientWidth: document.documentElement.clientWidth }))
            const pass = value.scrollWidth <= value.clientWidth
            checks.push({ label, width, ...value, pass })
            if (!pass) throw new Error(`${label}: ${value.scrollWidth} > ${value.clientWidth}`)
          }

          const browser = await chromium.launch()
          const checks = []
          try {
            const before = await browser.newPage({ viewport: { width: 390, height: 844 }, colorScheme: 'dark' })
            await mockApi(before)
            await before.goto('http://127.0.0.1:4174', { waitUntil: 'networkidle' })
            await waitSetup(before)
            await before.screenshot({ path: 'visual-evidence/before-mobile-setup-dark.png', fullPage: true })
            await startGame(before)
            await before.screenshot({ path: 'visual-evidence/before-mobile-gameplay-dark.png', fullPage: true })
            await before.setViewportSize({ width: 1280, height: 900 })
            await before.screenshot({ path: 'visual-evidence/before-desktop-gameplay-dark.png', fullPage: true })
            await before.close()

            const after = await browser.newPage({ viewport: { width: 390, height: 844 }, colorScheme: 'light' })
            await mockApi(after)
            await after.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' })
            await waitSetup(after)

            const viewport = await after.locator('meta[name="viewport"]').getAttribute('content')
            const zoomAllowed = !/user-scalable\s*=\s*no|maximum-scale\s*=\s*1(?:\.0)?/i.test(viewport || '')
            checks.push({ label: 'viewport-allows-zoom', value: viewport, pass: zoomAllowed })
            if (!zoomAllowed) throw new Error(`Viewport restricts zoom: ${viewport}`)

            for (const width of [360, 390, 768, 1024]) await noOverflow(after, width, `setup-${width}`, checks)
            await after.setViewportSize({ width: 390, height: 844 })
            await chooseTheme(after, '라이트')
            await after.screenshot({ path: 'visual-evidence/after-mobile-setup-light.png', fullPage: true })
            await chooseTheme(after, '다크')
            await after.screenshot({ path: 'visual-evidence/after-mobile-setup-dark.png', fullPage: true })

            await chooseTheme(after, '시스템')
            await after.emulateMedia({ colorScheme: 'dark' })
            await after.waitForFunction(() => document.documentElement.dataset.theme === 'dark')
            await after.emulateMedia({ colorScheme: 'light' })
            await after.waitForFunction(() => document.documentElement.dataset.theme === 'light')
            checks.push({ label: 'system-theme-follows-os', pass: true })

            await chooseTheme(after, '다크')
            await after.emulateMedia({ colorScheme: 'light' })
            await after.waitForTimeout(60)
            const explicitDark = await after.evaluate(() => document.documentElement.dataset.theme)
            checks.push({ label: 'explicit-theme-ignores-os', value: explicitDark, pass: explicitDark === 'dark' })
            if (explicitDark !== 'dark') throw new Error('Explicit dark theme was overwritten by OS preference')

            await after.reload({ waitUntil: 'networkidle' })
            await waitSetup(after)
            const persistedDark = await after.evaluate(() => document.documentElement.dataset.theme)
            checks.push({ label: 'explicit-theme-persists', value: persistedDark, pass: persistedDark === 'dark' })
            if (persistedDark !== 'dark') throw new Error('Explicit dark theme did not persist')

            await chooseTheme(after, '라이트')
            await startGame(after)
            await after.screenshot({ path: 'visual-evidence/after-mobile-gameplay-light.png', fullPage: true })
            await chooseTheme(after, '다크')
            await after.screenshot({ path: 'visual-evidence/after-mobile-gameplay-dark.png', fullPage: true })

            for (const width of [360, 390, 512, 768, 1024]) await noOverflow(after, width, `gameplay-${width}`, checks)
            checks.push({ label: '200-percent-reflow-proxy', note: '1024 physical px at 200% corresponds to about 512 CSS px; 512 and narrower layouts pass reflow.', pass: true })

            await after.setViewportSize({ width: 1280, height: 900 })
            await chooseTheme(after, '라이트')
            await after.screenshot({ path: 'visual-evidence/after-desktop-gameplay-light.png', fullPage: true })
            await chooseTheme(after, '다크')
            await after.screenshot({ path: 'visual-evidence/after-desktop-gameplay-dark.png', fullPage: true })

            const image = await after.locator('.scene-frame').evaluate(element => {
              const rect = element.getBoundingClientRect()
              const media = element.querySelector('img')
              const style = media ? getComputedStyle(media) : null
              return { width: rect.width, ratio: rect.width / rect.height, objectFit: style?.objectFit, filter: style?.filter }
            })
            const imagePass = image.width <= 768.5 && Math.abs(image.ratio - 16 / 9) < 0.03 && image.objectFit === 'contain' && image.filter === 'none'
            checks.push({ label: 'scene-image-contract', ...image, pass: imagePass })
            if (!imagePass) throw new Error(`Scene image contract failed: ${JSON.stringify(image)}`)
            await after.close()
          } finally {
            await browser.close()
          }

          await fs.writeFile('visual-evidence/checks.json', `${JSON.stringify(checks, null, 2)}\n`)
          console.log(JSON.stringify(checks, null, 2))
          NODE
          node visual-evidence/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: issue-61-visual-evidence
          path: frontend/visual-evidence/*.png
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: issue-61-visual-checks
          path: frontend/visual-evidence/checks.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary workflow and commit cleanup
        run: |
          rm .github/workflows/issue-61-visual-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/issue-61-visual-evidence.yml
          git commit -m "test(frontend): Charcoal Folio visual evidence 생성 [issue-61-visual]"
          git push origin HEAD:refactor/issue-61-charcoal-folio-ui
