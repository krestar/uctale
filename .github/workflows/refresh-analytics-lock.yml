name: Refresh analytics lockfile

on:
  push:
    branches:
      - feat/issue-59-vercel-web-analytics

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[analytics-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-59-vercel-web-analytics
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Remove temporary workflow
        run: rm .github/workflows/refresh-analytics-lock.yml
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/refresh-analytics-lock.yml
          git commit -m "chore(frontend): analytics lockfile 갱신 [analytics-lock]"
          git push origin HEAD:feat/issue-59-vercel-web-analytics
