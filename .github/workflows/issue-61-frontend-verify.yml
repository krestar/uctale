name: Verify issue 61 frontend

on:
  push:
    branches:
      - refactor/issue-61-charcoal-folio-ui

permissions:
  contents: write

jobs:
  verify-and-lock:
    if: ${{ !contains(github.event.head_commit.message, '[issue-61-verified]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/issue-61-charcoal-folio-ui

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Restore unrelated optional libc metadata
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'package-lock.json'
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'))
          const entries = {
            'node_modules/@rolldown/binding-linux-arm64-gnu': 'glibc',
            'node_modules/@rolldown/binding-linux-arm64-musl': 'musl',
            'node_modules/@rolldown/binding-linux-ppc64-gnu': 'glibc',
            'node_modules/@rolldown/binding-linux-s390x-gnu': 'glibc',
            'node_modules/@rolldown/binding-linux-x64-gnu': 'glibc',
            'node_modules/@rolldown/binding-linux-x64-musl': 'musl',
            'node_modules/lightningcss-linux-arm64-gnu': 'glibc',
            'node_modules/lightningcss-linux-arm64-musl': 'musl',
            'node_modules/lightningcss-linux-x64-gnu': 'glibc',
            'node_modules/lightningcss-linux-x64-musl': 'musl',
          }
          for (const [name, libc] of Object.entries(entries)) {
            const current = lock.packages[name]
            if (!current || current.libc) continue
            const normalized = {}
            for (const [key, value] of Object.entries(current)) {
              normalized[key] = value
              if (key === 'dev') normalized.libc = [libc]
            }
            lock.packages[name] = normalized
          }
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`)
          NODE

      - name: Install from lockfile
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Remove temporary workflow
        working-directory: .
        run: rm .github/workflows/issue-61-frontend-verify.yml

      - name: Commit verified lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/issue-61-frontend-verify.yml
          git commit -m "test(frontend): Charcoal Folio 검증 및 lockfile 반영 [issue-61-verified]"
          git push origin HEAD:refactor/issue-61-charcoal-folio-ui
